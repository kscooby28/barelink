name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk barelink.apk

      - uses: actions/upload-artifact@v4
        with:
          name: barelink
          path: barelink.apk
          if-no-files-found: error

      - name: Publish APK on the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Barelink APK
          target_commitish: main
          files: barelink.apk
          body: |
            Sideload `barelink.apk` on your Android phone.

            On the phone: download this file, open it, allow install from your browser if asked, then open Barelink.

            The app has no internet permission. It only rewrites links on the device.
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
